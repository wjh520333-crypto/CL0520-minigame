body.dark .hero-art { opacity: .27; }

/* 上下融入渐变：让壁纸自然融进页面底色，不产生生硬边界 */
.hero .hero-fade {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    var(--bg) 0%,
    rgba(0,0,0,0) 8%,
    rgba(0,0,0,0) 46%,
    var(--bg) 96%);
  pointer-events: none;
}

.hero h1 { font-size: 40px; font-weight: 900; letter-spacing: 1px; }
.hero h1 .grad {
  background: linear-gradient(120deg, #3f7ef0 10%, #7c5cf6 55%, #2dd4bf 95%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.hero .slogan { margin-top: 10px; font-size: 15px; color: var(--text-2); }

/* 站点标签胶囊（可见文字，供搜索引擎收录正文关键词） */
.site-tags {
  margin-top: 16px;
  display: flex; align-items: center; justify-content: center;
  gap: 8px; flex-wrap: wrap;
}
.site-tag {
  font-size: 12px; font-weight: 600;
  color: var(--text-2);
  background: var(--chip-hover);
  border-radius: 999px;
  padding: 3px 12px;
}

/* 搜索框（居中大圆角 + 联想下拉） */
.search-wrap { position: relative; max-width: 640px; margin: 30px auto 0; }
.search-box {
  display: flex; align-items: center; gap: 10px;
  height: 56px; padding: 0 10px 0 20px;
  border-radius: 28px;
  background: var(--input-bg);
  border: 1.5px solid transparent;
  box-shadow: var(--shadow-card);
  transition: border-color .2s ease, box-shadow .2s ease;
}
.search-box:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 5px var(--ring), var(--shadow-card);
}
.search-box svg { color: var(--text-3); flex: none; }
.search-box input {
  flex: 1; min-width: 0;
  border: none; outline: none; background: transparent;
  font-size: 16px; color: var(--text);
  font-family: inherit;
}
.search-box input::placeholder { color: var(--text-3); }
.search-box kbd {
  flex: none;
  font-family: inherit; font-size: 11px; font-weight: 600;
  color: var(--text-3);
  border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 6px; padding: 2px 8px;
  background: var(--bg-soft);
}
.search-go {
  flex: none; height: 40px; padding: 0 22px;
  border: none; border-radius: 20px;
  background: var(--brand); color: #fff;
  font-size: 15px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: background .2s ease;
}
.search-go:hover { background: var(--brand-deep); }

/* 联想下拉 */
.search-suggest {
  position: absolute; left: 0; right: 0; top: calc(100% + 10px);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow-float);
  padding: 8px;
  z-index: 60;
  text-align: left;
}
.search-suggest[hidden] { display: none; }
.sug-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 12px; cursor: pointer;
}
.sug-item:hover { background: var(--chip-hover); }
.sug-item .sug-name { font-size: 14.5px; font-weight: 600; color: var(--text); }
.sug-item .sug-meta { font-size: 11.5px; color: var(--text-3); }
.sug-item .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.sug-item .dot.live { background: #34c759; }
.sug-item .dot.plan { background: #9aa4b8; }

/* 热门标签行 */
.hot-row {
  margin-top: 22px;
  display: flex; align-items: center; justify-content: center;
  gap: 8px; flex-wrap: wrap;
}
.hot-label { font-size: 12px; color: var(--text-3); }
.hot-chip {
  font-size: 12.5px; font-weight: 600;
  color: var(--text-2);
  background: var(--chip-bg);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 14px;
  cursor: pointer; transition: all .18s ease;
}
.hot-chip:hover { color: var(--brand); border-color: var(--brand); background: var(--chip-hover); }

/* ========== 工具栏：分类胶囊 + 计数 ========== */
.main { max-width: 1080px; margin: 0 auto; padding: 0 22px 30px; }
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  margin-bottom: 20px;
}
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  font-size: 13px; font-weight: 600; font-family: inherit;
  color: var(--text-2);
  background: var(--chip-bg);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 16px;
  cursor: pointer; transition: all .18s ease;
}
.chip:hover { color: var(--brand); border-color: var(--brand); }
.chip.on {
  background: var(--chip-on);
  color: var(--chip-on-text);
  border-color: var(--chip-on);
}
.chip .n { opacity: .75; font-weight: 500; margin-left: 3px; font-size: 11.5px; }
.count { font-size: 12.5px; color: var(--text-3); }

/* ========== 游戏卡片墙 ========== */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.game {
  border-radius: 18px;
  background: var(--card);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  display: flex; flex-direction: column;
  text-decoration: none; color: var(--text);
  transition: transform .22s ease, box-shadow .22s ease;
}
.game:hover { transform: translateY(-5px); box-shadow: var(--shadow-float); }
.game:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
.game.planned { box-shadow: none; border: 1px dashed var(--line); background: var(--bg-soft); }

/* 封面区（视觉核心） */
.cover {
  position: relative;
  aspect-ratio: 4 / 3;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.cover .art { opacity: .95; }
.game.planned .cover .art { opacity: .45; }
.cover::after {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 60% at 50% 118%, rgba(0,0,0,.14) 0%, transparent 60%);
}
.game.planned .cover { filter: saturate(.35); }
.status-badge {
  position: absolute; top: 10px; left: 10px; z-index: 2;
  font-size: 11px; font-weight: 700;
  border-radius: 999px;
  padding: 3px 11px;
  backdrop-filter: blur(4px);
}
.status-badge.live { background: rgba(52,199,89,.92); color: #fff; box-shadow: 0 2px 8px rgba(52,199,89,.4); }
.status-badge.plan { background: rgba(255,255,255,.82); color: #6b7688; }

/* 信息区（压缩到最少） */
.info { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.info .name { font-size: 15.5px; font-weight: 700; }
.info .desc { font-size: 12.5px; color: var(--text-2); line-height: 1.55; }
.info .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
.tag {
  font-size: 11px; color: var(--text-3);
  background: var(--bg); border-radius: 6px; padding: 2px 8px;
}
.game.planned .tag { background: transparent; border: 1px solid var(--line); }
.play-line {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 4px;
}
.play-cta { font-size: 13px; font-weight: 700; color: var(--brand); }
.game.planned .play-cta { color: var(--text-3); }
.arrow { transition: transform .2s ease; }
.game:hover .arrow { transform: translateX(3px); }

/* 空状态 */
.empty {
  text-align: center;
  padding: 70px 20px;
  color: var(--text-3);
}
.empty .big { font-size: 40px; margin-bottom: 12px; opacity: .6; }
.empty p { font-size: 14px; }
.empty button {
  margin-top: 14px;
  font-size: 13px; font-weight: 600; font-family: inherit;
  color: var(--brand); background: transparent;
  border: 1.5px solid var(--brand); border-radius: 999px;
  padding: 7px 22px; cursor: pointer;
}
.empty button:hover { background: var(--ring); }

/* ========== 页脚 ========== */
.foot {
  border-top: 1px solid var(--line);
  padding: 22px 20px 30px;
  text-align: center;
  color: var(--text-3);
  font-size: 12px;
}
.foot .foot-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.foot .sep { opacity: .5; }

/* ========== 响应式 ========== */
@media screen and (max-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media screen and (max-width: 780px) {
  .hero { padding-top: 52px; padding-bottom: 42px; }
  .hero h1 { font-size: 30px; }
  .search-box kbd { display: none; }
  .brand-sub { display: none; }
}
@media screen and (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .info .desc { display: none; }
  .main { padding: 0 14px 24px; }
}

/* ========== 打印降级 ========== */
@media print {
  body { background: #fff; color: #000; }
  .topbar, .search-wrap, .hot-row, .chips, .foot,
  .hero .hero-art, .hero .hero-fade { display: none; }
  .game { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
}
</style>

  <!-- 首屏：壁纸背景 + 标语 + 大搜索框 + 热门标签 -->
  <header class="hero">
    <div class="hero-art" aria-hidden="true"></div>
    <div class="hero-fade" aria-hidden="true"></div>
    <h1><span class="grad">线上小游戏合集</span></h1>
    <p class="slogan">一个网址，玩遍所有线上小游戏 · 免下载免登录</p>

    <div class="site-tags" aria-label="站点标签">
      <span class="site-tag">线上小游戏</span>
      <span class="site-tag">免费畅玩</span>
      <span class="site-tag">休闲畅玩</span>
      <span class="site-tag">不断更新</span>
      <span class="site-tag">感谢收藏</span>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.8-3.8"></path>
        </svg>
        <input id="searchInput" type="text" autocomplete="off" spellcheck="false"
               placeholder="搜索游戏名称、玩法或标签…" aria-label="搜索游戏">
        <kbd>Enter</kbd>
        <button class="search-go" id="searchGo" type="button">搜索</button>
      </div>
      <div class="search-suggest" id="suggest" hidden></div>
    </div>

    <div class="hot-row" id="hotRow">
      <span class="hot-label">热门搜索</span>
      <!-- 热门标签由脚本注入 -->
    </div>
  </header>

  <!-- 工具栏：分类胶囊 + 结果计数 -->
  <main class="main">
    <div class="toolbar">
      <div class="chips" id="chips" role="tablist" aria-label="游戏分类筛选">
        <!-- 胶囊由脚本注入 -->
      </div>
      <span class="count" id="count"></span>
    </div>

    <!-- 游戏卡片墙 -->
    <!-- 注意：下面 #grid 里手写的静态卡片是给不执行 JavaScript 的搜索引擎抓取用的（SEO）；
         游戏列表的真正数据源是页面底部 script 里的 GAMES 数组，页面加载后由它重建卡片。
         新增游戏时：更新 GAMES 数组后，请在这里同步复制一或多张对应的静态卡片。 -->
    <div class="grid" id="grid" data-layout="grid" data-cols="4">
      <a class="game" href="猜数字-可玩原型.html" target="_blank" rel="noopener" aria-label="猜数字，点击开始玩">
        <div class="cover" style="background:linear-gradient(135deg, #4a8dff 0%, #2c5fd8 58%, #1e3a8f 100%)">
          <span class="status-badge live">可玩</span>
          <svg class="art" width="86" height="86" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.4"/><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="0.7" fill="#ffffff" stroke="none"/></svg>
        </div>
        <div class="info">
          <div class="name">猜数字</div>
          <div class="desc">系统藏一个 1–100 的数，「大了 / 小了」提示收窄范围</div>
          <div class="tags"><span class="tag">益智</span><span class="tag">单机</span><span class="tag">一分钟一局</span></div>
          <div class="play-line">
            <span class="play-cta">开始玩</span>
            <svg class="arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </div>
        </div>
      </a>
      <a class="game planned" aria-disabled="true" aria-label="记忆翻牌，开发中" onclick="return false" href="javascript:void(0)">
        <div class="cover" style="background:linear-gradient(135deg, #a78bfa 0%, #7c5cf6 58%, #5b3ec7 100%)">
          <span class="status-badge plan">开发中</span>
          <svg class="art" width="86" height="86" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="7.2" height="9.6" rx="1.8"/><rect x="12.8" y="5" width="7.2" height="9.6" rx="1.8"/><rect x="4" y="15.4" width="7.2" height="4.6" rx="1.8"/><rect x="12.8" y="15.4" width="7.2" height="4.6" rx="1.8"/></svg>
        </div>
        <div class="info">
          <div class="name">记忆翻牌</div>
          <div class="desc">翻开卡牌找相同配对，步数越少评价越高</div>
          <div class="tags"><span class="tag">益智</span><span class="tag">单机</span></div>
          <div class="play-line">
            <span class="play-cta">敬请期待</span>
            <svg class="arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </div>
        </div>
      </a>
      <a class="game planned" aria-disabled="true" aria-label="数字华容道，开发中" onclick="return false" href="javascript:void(0)">
        <div class="cover" style="background:linear-gradient(135deg, #2dd4bf 0%, #14a08f 58%, #0c7d72 100%)">
          <span class="status-badge plan">开发中</span>
          <svg class="art" width="86" height="86" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.4"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg>
        </div>
        <div class="info">
          <div class="name">数字华容道</div>
          <div class="desc">滑动合并相同数字，冲向 2048</div>
          <div class="tags"><span class="tag">休闲</span><span class="tag">单机</span></div>
          <div class="play-line">
            <span class="play-cta">敬请期待</span>
            <svg class="arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </div>
        </div>
      </a>
    </div>

    <!-- 空状态 -->
    <div class="empty" id="empty" hidden>
      <div class="big">🔍</div>
      <p id="emptyText">没有找到相关游戏</p>
      <button type="button" id="clearBtn">清除筛选</button>
    </div>
  </main>

  <footer class="foot">
    <div class="foot-row">
      <span>线上小游戏合集 · 免费畅玩 · 休闲畅玩</span><span class="sep">·</span>
      <span>一款游戏一个文件，随做随上 · 不断更新</span><span class="sep">·</span>
      <span>电脑 / 手机浏览器均可访问 · 感谢收藏</span>
    </div>
  </footer>

<script>
'use strict';

/* ================================================================
   游戏数据：以后每做一款新游戏，往这个数组里加一条就行
   status: 'live'（已上线，可玩） / 'plan'（规划中）
   cover : 封面渐变色 + 中心 SVG 图形（自动渲染）
   ================================================================ */

const COVER_ART = {
  target: '<svg class="art" width="86" height="86" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.4"/><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="0.7" fill="#ffffff" stroke="none"/></svg>',
  cards:  '<svg class="art" width="86" height="86" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="7.2" height="9.6" rx="1.8"/><rect x="12.8" y="5" width="7.2" height="9.6" rx="1.8"/><rect x="4" y="15.4" width="7.2" height="4.6" rx="1.8"/><rect x="12.8" y="15.4" width="7.2" height="4.6" rx="1.8"/></svg>',
  grid:   '<svg class="art" width="86" height="86" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.4"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg>'
};

const GAMES = [
  {
    name: '猜数字',
    desc: '系统藏一个 1–100 的数，「大了 / 小了」提示收窄范围',
    tags: ['益智', '单机', '一分钟一局'],
    cat: '益智',
    status: 'live',
    url: '猜数字-可玩原型.html',
    cover: 'linear-gradient(135deg, #4a8dff 0%, #2c5fd8 58%, #1e3a8f 100%)',
    art: 'target'
  },
  {
    name: '记忆翻牌',
    desc: '翻开卡牌找相同配对，步数越少评价越高',
    tags: ['益智', '单机'],
    cat: '益智',
    status: 'plan',
    url: '',
    cover: 'linear-gradient(135deg, #a78bfa 0%, #7c5cf6 58%, #5b3ec7 100%)',
    art: 'cards'
  },
  {
    name: '数字华容道',
    desc: '滑动合并相同数字，冲向 2048',
    tags: ['休闲', '单机'],
    cat: '休闲',
    status: 'plan',
    url: '',
    cover: 'linear-gradient(135deg, #2dd4bf 0%, #14a08f 58%, #0c7d72 100%)',
    art: 'grid'
  }
];

/* ===== 分类胶囊定义 ===== */
const CATS = [
  { key: 'all', label: '全部' },
  { key: '益智', label: '益智' },
  { key: '休闲', label: '休闲' },
  { key: 'live', label: '已上线' },
  { key: 'plan', label: '规划中' }
];

const HOT_WORDS = ['猜数字', '益智', '翻牌', '2048'];

/* ===== 状态 ===== */
let query = '';
let cat = 'all';

/* ===== DOM ===== */
const els = {
  input: document.getElementById('searchInput'),
  go: document.getElementById('searchGo'),
  suggest: document.getElementById('suggest'),
  hotRow: document.getElementById('hotRow'),
  chips: document.getElementById('chips'),
  count: document.getElementById('count'),
  grid: document.getElementById('grid'),
  empty: document.getElementById('empty'),
  emptyText: document.getElementById('emptyText'),
  clearBtn: document.getElementById('clearBtn'),
  themeBtn: document.getElementById('themeBtn'),
  iconMoon: document.getElementById('iconMoon'),
  iconSun: document.getElementById('iconSun')
};

/* ===== 过滤逻辑：搜索词 + 分类胶囊 叠加 ===== */
function matches(g) {
  const q = query.trim().toLowerCase();
  const hitQuery = !q ||
    g.name.toLowerCase().indexOf(q) > -1 ||
    g.desc.toLowerCase().indexOf(q) > -1 ||
    g.tags.some(t => t.toLowerCase().indexOf(q) > -1);
  const hitCat =
    cat === 'all' ? true :
    cat === 'live' ? g.status === 'live' :
    cat === 'plan' ? g.status === 'plan' :
    g.cat === cat;
  return hitQuery && hitCat;
}

/* ===== 渲染卡片墙 ===== */
function render() {
  const list = GAMES.filter(matches);

  els.grid.innerHTML = list.map(function (g) {
    const live = g.status === 'live';
    return '<a class="game' + (live ? '' : ' planned') + '"' +
           (live ? ' href="' + g.url + '" target="_blank" rel="noopener"' : ' aria-disabled="true" href="javascript:void(0)" onclick="return false"') +
           ' aria-label="' + g.name + (live ? '，点击开始玩' : '，开发中') + '">' +
      '<div class="cover" style="background:' + g.cover + '">' +
        '<span class="status-badge ' + g.status + '">' + (live ? '可玩' : '开发中') + '</span>' +
        COVER_ART[g.art] +
      '</div>' +
      '<div class="info">' +
        '<div class="name">' + g.name + '</div>' +
        '<div class="desc">' + g.desc + '</div>' +
        '<div class="tags">' + g.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div>' +
        '<div class="play-line">' +
          '<span class="play-cta">' + (live ? '开始玩' : '敬请期待') + '</span>' +
          '<svg class="arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
        '</div>' +
      '</div>' +
    '</a>';
  }).join('');

  els.grid.hidden = list.length === 0;
  els.empty.hidden = list.length !== 0;
  if (list.length === 0) {
    els.emptyText.textContent = query.trim()
      ? '没有找到「' + query.trim() + '」相关游戏，换个词试试'
      : '这个分类下暂时没有游戏';
  }
  els.count.textContent = '共 ' + list.length + ' 款';
}

/* ===== 分类胶囊 ===== */
function renderChips() {
  els.chips.innerHTML = CATS.map(function (c) {
    const n = GAMES.filter(function (g) {
      return c.key === 'all' ? true :
             c.key === 'live' ? g.status === 'live' :
             c.key === 'plan' ? g.status === 'plan' :
             g.cat === c.key;
    }).length;
    return '<button class="chip' + (cat === c.key ? ' on' : '') + '" type="button" data-cat="' + c.key + '">' +
           c.label + '<span class="n">' + n + '</span></button>';
  }).join('');
}

els.chips.addEventListener('click', function (e) {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  cat = btn.dataset.cat;
  renderChips();
  render();
});

/* ===== 搜索：输入联想 + Enter 过滤 ===== */
function applyQuery() {
  render();
  hideSuggest();
}

els.input.addEventListener('input', function () {
  query = els.input.value;      // 实时同步，边输入边过滤
  renderSuggest();
  render();
});
els.input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { applyQuery(); els.input.blur(); }
});
els.go.addEventListener('click', applyQuery);

/* 联想下拉：输入时显示匹配游戏 */
function renderSuggest() {
  const q = els.input.value.trim().toLowerCase();
  if (!q) { hideSuggest(); return; }
  const hits = GAMES.filter(function (g) {
    return g.name.toLowerCase().indexOf(q) > -1 || g.desc.toLowerCase().indexOf(q) > -1;
  }).slice(0, 6);
  if (hits.length === 0) { hideSuggest(); return; }
  els.suggest.innerHTML = hits.map(function (g) {
    return '<div class="sug-item" data-name="' + g.name + '">' +
      '<span class="dot ' + g.status + '"></span>' +
      '<span class="sug-name">' + g.name + '</span>' +
      '<span class="sug-meta">' + (g.status === 'live' ? '可玩' : '开发中') + ' · ' + g.cat + '</span>' +
    '</div>';
  }).join('');
  els.suggest.hidden = false;
}
function hideSuggest() { els.suggest.hidden = true; }

els.suggest.addEventListener('mousedown', function (e) {
  const item = e.target.closest('.sug-item');
  if (!item) return;
  e.preventDefault();
  els.input.value = item.dataset.name;
  query = els.input.value;
  applyQuery();
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('.search-wrap')) hideSuggest();
});

/* ===== 热门标签 ===== */
els.hotRow.insertAdjacentHTML('beforeend', HOT_WORDS.map(function (w) {
  return '<button class="hot-chip" type="button" data-word="' + w + '">' + w + '</button>';
}).join(''));
els.hotRow.addEventListener('click', function (e) {
  const chip = e.target.closest('.hot-chip');
  if (!chip) return;
  els.input.value = chip.dataset.word;
  query = els.input.value;
  applyQuery();
  els.input.focus();
});

/* ===== 空状态清除 ===== */
els.clearBtn.addEventListener('click', function () {
  query = '';
  cat = 'all';
  els.input.value = '';
  renderChips();
  render();
});

/* ===== 明暗模式 ===== */
function setTheme(dark) {
  document.body.classList.toggle('dark', dark);
  els.iconMoon.hidden = dark;
  els.iconSun.hidden = !dark;
  try { localStorage.setItem('gn-theme', dark ? 'dark' : 'light'); } catch (e) {}
}
els.themeBtn.addEventListener('click', function () {
  setTheme(!document.body.classList.contains('dark'));
});
(function () {
  let saved = null;
  try { saved = localStorage.getItem('gn-theme'); } catch (e) {}
  if (saved === 'dark') setTheme(true);
})();

/* ===== 初始渲染 ===== */
renderChips();
render();
</script>
</body>
</html>
